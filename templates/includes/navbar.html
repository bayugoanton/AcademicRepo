<nav class="navbar navbar-expand-lg fixed-top shadow-sm py-2" style="background: rgba(84, 11, 24, 0.96); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08);">
    <div class="container px-lg-4">
        <a class="navbar-brand fw-extrabold fs-3 d-flex align-items-center tracking-tight text-white" style="font-family: var(--font-display);" href="{% url 'home' %}">
            <span class="me-2 d-flex align-items-center justify-content-center bg-white bg-opacity-10 rounded-3 p-2 border border-white border-opacity-10" style="width: 42px; height: 42px;">
                <i class="fa-solid fa-building-columns" style="color: var(--premium-gold); font-size: 1.25rem;"></i>
            </span>
            Research<span style="color: var(--premium-gold); font-weight: 400; margin-left: 2px;">Vault</span>
        </a>
        
        <button class="navbar-toggler border-0 text-white-50" type="button" data-bs-toggle="collapse" data-bs-target="#navMatrix" aria-controls="navMatrix" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navMatrix">
            <div class="ms-auto d-flex flex-column flex-lg-row align-items-lg-center">
                
                {% if not user.is_authenticated %}
                    <ul class="navbar-nav flex-row gap-2 gap-lg-1 mb-3 mb-lg-0 me-lg-3 align-items-center">
                        <li class="nav-item px-1"><a class="nav-link text-white text-opacity-75 hover-opacity-100 fs-6 py-1" href="{% url 'home' %}#home">Home</a></li>
                        <li class="nav-item px-1"><a class="nav-link text-white text-opacity-75 hover-opacity-100 fs-6 py-1" href="{% url 'home' %}#about">About Platform</a></li>
                        <li class="nav-item px-1"><a class="nav-link text-white text-opacity-75 hover-opacity-100 fs-6 py-1" href="{% url 'home' %}#contact">Contact Support</a></li>
                    </ul>
                    <span class="vr d-none d-lg-block bg-white opacity-20 me-3" style="height: 1.75rem;"></span>
                    <div class="d-flex align-items-center gap-2">
                        <a href="{% url 'login' %}" class="btn btn-link text-white text-decoration-none px-3 fs-6">Sign In</a>
                        <a href="{% url 'register' %}" class="btn btn-sm text-dark px-4 fw-bold shadow-sm" style="background-color: var(--premium-gold); border-radius: 8px; font-family: var(--font-display); padding-top: 7px; padding-bottom: 7px;">Register Account</a>
                    </div>
                {% else %}
                    <div class="d-flex align-items-center flex-wrap gap-3">
                        <div class="bg-white bg-opacity-10 rounded-pill px-2 py-1 border border-white border-opacity-10 d-flex align-items-center">
                            
                            {% if user.profile.avatar %}
                                <img src="{{ user.profile.avatar.url }}" alt="{{ user.username }}" class="rounded-circle me-2 border border-white border-opacity-25 shadow-sm" style="width: 50px; height: 50px; object-fit: cover;">
                            {% else %}
                                <div class="rounded-circle me-2 d-flex align-items-center justify-content-center shadow-sm" style="width: 50px; height: 50px; background-color: var(--premium-gold); font-size: 20px; color: white;">
                                    {{ user.username|slice:":1"|upper }}
                                </div>
                            {% endif %}
                            
                            <span class="text-white small fw-medium pe-3">Welcome, <strong style="color: var(--premium-gold);">{{ user.username }}</strong></span>
                        </div>
                        
                        <form action="{% url 'logout' %}" method="post" class="d-inline m-0">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-danger px-3 bg-opacity-75 border-0" style="border-radius: 8px; padding-top: 6px; padding-bottom: 6px;">Logout</button>
                        </form>
                    </div>
                {% endif %}
                
            </div>
        </div>
    </div>
</nav>
