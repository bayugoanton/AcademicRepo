{% extends 'base.html' %}
{% block public_content %}
<div class="container py-5 evsu-card p-4">
    <h2 class="text-maroon"><i class="fa-solid fa-envelope me-2"></i>Academic Communications Office</h2>
    <hr class="border-warning">
    <form class="row g-3">
        <div class="col-md-6"><label class="form-label">Scholar Designation Identity Name</label><input type="text" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Network Verification Communication Address</label><input type="email" class="form-control"></div>
        <div class="col-12"><label class="form-label">Transmission Communication Payload Core Matrix Data Box</label><textarea class="form-control" rows="4"></textarea></div>
        <div class="col-12"><button type="submit" class="btn evsu-btn-primary">Transmit Matrix Package</button></div>
    </form>
</div>
{% endblock %}
