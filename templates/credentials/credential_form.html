{% extends 'base.html' %}
{% block content %}
<div class="container-fluid px-md-4" style="padding-top: 95px; min-height: 100vh;">
    <div class="row">
        {% if user.is_authenticated %}{% include 'includes/sidebar.html' %}{% endif %}

        <main class="{% if user.is_authenticated %}col-md-9 ms-sm-auto col-lg-10{% else %}col-12{% endif %} px-md-4 pb-5">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card p-4 p-md-5" style="border-radius: 20px; border: 1px solid rgba(0,0,0,0.05);">
                        <h4 class="fw-extrabold mb-4">Register New Credential</h4>
                        
                        <form method="post" enctype="multipart/form-data" class="row g-3">
                            {% csrf_token %}
                            <!-- Loop through fields to keep code clean -->
                            {% for field in form %}
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-uppercase text-muted">{{ field.label }}</label>
                                {{ field }}
                            </div>
                            {% endfor %}
                            
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn text-white w-100 py-3" style="background-color: var(--primary-maroon); border-radius: 12px; font-weight: 700;">
                                    <i class="fa-solid fa-floppy-disk me-2"></i> Save Credential to Vault
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
{% endblock %}
