{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-md-4" style="padding-top: 95px; min-height: 100vh;">
    <div class="row">
        {% if user.is_authenticated %}{% include 'includes/sidebar.html' %}{% endif %}

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-5">
            <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
                <h3 class="fw-bold text-dark">Edit Academic Profile</h3>
                <a href="{% url 'portfolio_view' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-4">
                    <div class="col-lg-6">
                        <div class="card p-4 border-0 shadow-sm">
                            <h5 class="fw-bold text-primary">Institutional Details</h5>
                            <hr>
                            {{ u_form.as_p }}
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card p-4 border-0 shadow-sm">
                            <h5 class="fw-bold text-primary">Research Profile</h5>
                            <hr>
                            {{ p_form.as_p }}
                        </div>
                    </div>
                </div>
                <div class="mt-4 p-3 bg-white rounded shadow-sm d-flex justify-content-end">
                    <button type="submit" class="btn text-white px-5" style="background-color: var(--primary-maroon);">
                        Save Changes
                    </button>
                </div>
            </form>
        </main>
    </div>
</div>
{% endblock %}
